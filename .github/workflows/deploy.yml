name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create or reuse KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 检查 KV namespace 是否存在
          KV_LIST=$(npx wrangler kv namespace list --json)
          KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title == "cf-webdav-kv") | .id')
          
          if [ -z "$KV_ID" ]; then
            echo "创建 KV namespace: cf-webdav-kv"
            CREATE_RESULT=$(npx wrangler kv namespace create cf-webdav-kv --json)
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.id')
            echo "创建成功: $KV_ID"
          else
            echo "KV namespace 已存在: $KV_ID"
          fi
          
          # 更新 wrangler.toml 中的 KV ID
          sed -i "s/id = \"replace-during-setup\"/id = \"$KV_ID\"/" wrangler.toml

      - name: Create or reuse R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 检查 R2 bucket 是否存在
          BUCKET_LIST=$(npx wrangler r2 bucket list --json)
          BUCKET_EXISTS=$(echo "$BUCKET_LIST" | jq -r '.[] | select(.name == "cf-webdav-files") | .name')
          
          if [ -z "$BUCKET_EXISTS" ]; then
            echo "创建 R2 bucket: cf-webdav-files"
            npx wrangler r2 bucket create cf-webdav-files
            echo "创建成功"
          else
            echo "R2 bucket 已存在"
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
