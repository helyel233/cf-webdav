name = "cf-webdav"
main = "src/index.ts"
compatibility_date = "2026-09-22"
workers_dev = true

# 如果你在 Cloudflare Dashboard 中手动绑定了 KV/R2，这里的占位值会被控制台绑定覆盖。
# 只有本地或 CI 中使用 Wrangler 部署时，才需要保证这里的 id 与真实 KV Namespace 一致。

[[kv_namespaces]]
binding = "WEBDAV_KV"
# 本地部署时，执行 `npm run deploy:setup` 会自动回写真实的 KV Namespace ID。
id = "replace-during-setup"

[[r2_buckets]]
binding = "WEBDAV_BUCKET"
# 该名称需全局唯一；如果已被占用，请替换为带随机后缀的名称，例如 cf-webdav-files-xyz789
bucket_name = "cf-webdav-files"

[vars]
# 留空表示根路径；如需添加固定前缀，可设置为 "team-files"
DAV_PREFIX = ""
# true 时启用访问日志，可在后台查看
