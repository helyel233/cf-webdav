name = "cf-webdav"
main = "src/index.ts"
compatibility_date = "2026-09-22"
workers_dev = true

# ==============================================================================
# 部署说明
# ==============================================================================
# 【控制台部署】如果你在 Cloudflare 控制台创建并绑定资源，此文件中的 ID 配置会被忽略，
# 控制台会直接使用你绑定的资源。无需修改下面的 id 字段。
#
# 【本地/CLI 部署】运行 `npm run deploy:setup` 会自动创建资源并回写 KV namespace ID。
# ==============================================================================

# KV Namespace：存储目录标记、文件元数据和凭证配置
# 注意：KV namespace 名称需要全局唯一，如果默认名称已被使用，请修改为带随机后缀的名称
# 例如：cf-webdav-kv-a1b2c3
[[kv_namespaces]]
binding = "WEBDAV_KV"
# 此 ID 会在运行 `npm run deploy:setup` 时自动替换
# 控制台部署时请忽略此值，在控制台的 "Settings -> Variables and Bindings" 中绑定
id = "replace-during-setup"

# R2 Bucket：存储文件内容
# 注意：Bucket 名称需要全局唯一，如果默认名称已被使用，请修改为带随机后缀的名称
# 例如：cf-webdav-files-xyz789
[[r2_buckets]]
binding = "WEBDAV_BUCKET"
bucket_name = "cf-webdav-files"

# 可选配置
[vars]
# DAV_PREFIX：WebDAV 路径前缀，留空表示根路径
# 例如设置为 "team-files" 后，所有文件会存储在 R2 的 team-files/ 前缀下
DAV_PREFIX = ""
