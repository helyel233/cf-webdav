name = "cf-webdav"
main = "src/index.ts"
compatibility_date = "2026-09-22"
workers_dev = true

# 默认资源名称：KV `cf-webdav-kv`，R2 `cf-webdav-files`。
# 首次部署运行 `npm run deploy:setup`，脚本会自动创建或复用资源并回写 KV ID。
[[kv_namespaces]]
binding = "WEBDAV_KV"
id = "replace-during-setup"

[[r2_buckets]]
binding = "WEBDAV_BUCKET"
bucket_name = "cf-webdav-files"

[vars]
DAV_PREFIX = ""
TRUST_PROXY = "false"